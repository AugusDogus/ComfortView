name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish or retry (leave empty for build only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      name: ${{ steps.package.outputs.name }}
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - name: Check release tooling
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test tests/

      - name: Install SteamCMD
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          echo "MANAGED_DIR=$RUNNER_TEMP/valheim/valheim_server_Data/Managed" >> "$GITHUB_ENV"
          echo "BEPINEX_DIR=$RUNNER_TEMP/bepinex/BepInExPack_Valheim/BepInEx" >> "$GITHUB_ENV"

      - name: Download game and BepInEx references
        run: |
          # A cold SteamCMD app-info cache can fail with "Missing configuration".
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +force_install_dir "$RUNNER_TEMP/valheim" \
              +login anonymous +app_update 896660 validate +quit \
              && test -f "$MANAGED_DIR/assembly_valheim.dll"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::SteamCMD could not download Valheim app 896660 after three attempts. See the SteamCMD errors above, then rerun the job. No package was published."
              exit 1
            fi
            echo "SteamCMD download attempt $attempt failed; retrying in 5 seconds."
            sleep 5
          done
          bepinex_version=$(jq -er '.dependencies[] | select(startswith("denikson-BepInExPack_Valheim-")) | ltrimstr("denikson-BepInExPack_Valheim-")' package/manifest.json)
          curl --fail --location --retry 3 \
            "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/$bepinex_version/" \
            -o "$RUNNER_TEMP/bepinex.zip"
          unzip -q "$RUNNER_TEMP/bepinex.zip" -d "$RUNNER_TEMP/bepinex"

      - name: Build plugin and package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          dotnet build src/*/*.csproj -c Release -t:Package \
            -p:ManagedDir="$MANAGED_DIR" -p:BepInExDir="$BEPINEX_DIR"

      - name: Check plugin behavior and game compatibility
        run: bash scripts/check.sh

      - name: Validate package and release version
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: bun run scripts/validate-package.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thunderstore-package
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: thunderstore-publish
      cancel-in-progress: false
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      PACKAGE_NAME: ${{ needs.build.outputs.name }}
      PACKAGE_ARCHIVE: ${{ needs.build.outputs.archive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: thunderstore-package
          path: artifacts
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Create GitHub release and attach package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_ARCHIVE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_ARCHIVE" \
              --verify-tag --title "$PACKAGE_NAME $PACKAGE_VERSION" --generate-notes
          fi

      - name: Install Thunderstore CLI
        run: dotnet tool install --global tcli --version 0.2.4

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
          THUNDERSTORE_NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE }}
        run: |
          if [[ -z "$TCLI_AUTH_TOKEN" || -z "$THUNDERSTORE_NAMESPACE" ]]; then
            echo "::error::Set the TCLI_AUTH_TOKEN Actions secret and THUNDERSTORE_NAMESPACE Actions variable. The built ZIP is available on the GitHub release; rerun this job after setup."
            exit 1
          fi
          if [[ ! "$THUNDERSTORE_NAMESPACE" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::THUNDERSTORE_NAMESPACE must contain only letters, digits, and underscores."
            exit 1
          fi
          # tcli 0.2.4 forbids package metadata flags alongside --file.
          publish_config="$RUNNER_TEMP/thunderstore-publish.toml"
          printf '[package]\nnamespace = "%s"\nname = "%s"\nversionNumber = "%s"\n\n' \
            "$THUNDERSTORE_NAMESPACE" "$PACKAGE_NAME" "$PACKAGE_VERSION" > "$publish_config"
          cat thunderstore.toml >> "$publish_config"
          tcli publish --config-path "$publish_config" --file "$PACKAGE_ARCHIVE"
